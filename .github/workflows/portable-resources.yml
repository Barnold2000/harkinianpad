name: Portable port resources
on:
  pull_request:
    paths:
      - 'scripts/build-port-archive.py'
      - 'scripts/ci-port-resources.py'
      - 'tests/port_archive_test.py'
      - 'sources.lock.json'
      - '.github/workflows/portable-resources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, host: linux-x86_64, python: '3.11', architecture: x64}
          - {runner: windows-latest, host: windows-x86_64, python: '3.11', architecture: x64}
          - {runner: ubuntu-24.04-arm, host: linux-arm64, python: '3.13', architecture: arm64}
          - {runner: windows-11-arm, host: windows-arm64, python: '3.13', architecture: arm64}
          - {runner: macos-15, host: macos-arm64, python: '3.11', architecture: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - run: python -B -m unittest discover -s tests -p port_archive_test.py
      - run: python scripts/ci-port-resources.py --work private-resource-check --expected-host ${{ matrix.host }}
      # Resource-generation evidence only. No app, module or archive upload.
